name: Build Status

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - LICENSE
      - README.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python:
          - version: "3.10"
            cibuildwheel: "cp310"
            primary: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions-ext/python/setup@c8228d827a81b9f8c808825328af361c45461ba3
        with:
          version: ${{ matrix.python.version }}

      - name: Setup C++
        uses: actions-ext/cpp/setup@7de57593fbcba72d513072bfb4b30b5a344aa547

      - name: Install dependencies
        run: make develop

      - name: Lint
        run: make lint
        if: matrix.os == 'ubuntu-latest' && matrix.python.primary

      - name: Checks
        run: make checks
        if: matrix.os == 'ubuntu-latest' && matrix.python.primary

      - name: Test
        run: make coverage

      - name: Upload test results (Python)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python.version }}
          path: junit.xml
        if: matrix.os == 'ubuntu-latest' && matrix.python.primary

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d  # v2.25.0
        with:
          files: '**/junit.xml'
        if: matrix.os == 'ubuntu-latest' && matrix.python.primary

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Install build dependencies
        run: pip install cibuildwheel

      - name: Build distributions (Linux)
        run: |
          rm -rf dist
          make dist-py-sdist
          make dist-py-wheel
          make dist-check
        env:
          CIBW_BUILD: "${{ matrix.python.cibuildwheel }}-manylinux*"
          CIBW_BUILD_VERBOSITY: 3
        if: matrix.os == 'ubuntu-latest'

      - name: Build distributions (macOS)
        run: |
          rm -rf dist
          make dist-py-wheel
        env:
          CIBW_BUILD: "${{ matrix.python.cibuildwheel }}-macos*"
          CIBW_BUILD_VERBOSITY: 3
        if: matrix.os == 'macos-latest'

      - name: Build distributions (Windows)
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          make dist-py-wheel
        env:
          CIBW_BUILD: "${{ matrix.python.cibuildwheel }}-win_amd64"
        if: matrix.os == 'windows-latest'

      - name: Test wheel
        uses: actions-ext/python/test-wheel@ec67f82b3bd863948308a41ecb9e70547cbb19c7
        with:
          module: numba_cfunc_compiler
        if: matrix.os == 'ubuntu-latest'

      - name: Test source distribution
        uses: actions-ext/python/test-sdist@c8228d827a81b9f8c808825328af361c45461ba3
        with:
          module: numba_cfunc_compiler
        if: matrix.os == 'ubuntu-latest'

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python.version }}
          path: dist
