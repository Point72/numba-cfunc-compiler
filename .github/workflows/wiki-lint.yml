name: Lint Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: docs-lint
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  lint:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
        python-version:
          - 3.11

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions-ext/python/setup@c7ef9cbf13bc854a8d1422e9f8c6ee7a7ce1b911
        with:
          version: ${{ matrix.python-version }}

      - name: Install python dependencies
        run: python -m pip install mdformat "mdformat-tables>=1" codespell

      - name: Docs Lint Steps
        run: make lint-docs
