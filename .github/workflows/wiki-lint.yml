name: Lint Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: docs-lint
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  lint:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
        python-version:
          - 3.11

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions-ext/python/setup@ec67f82b3bd863948308a41ecb9e70547cbb19c7
        with:
          version: ${{ matrix.python-version }}

      - name: Install python dependencies
        run: python -m pip install mdformat "mdformat-tables>=1" codespell

      - name: Docs Lint Steps
        run: make lint-docs
